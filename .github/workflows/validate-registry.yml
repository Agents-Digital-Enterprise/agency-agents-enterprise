name: Validate Projects Registry

on:
  push:
    paths:
      - 'projects-registry.json'
      - 'projects-registry.schema.json'
  pull_request:
    paths:
      - 'projects-registry.json'
      - 'projects-registry.schema.json'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install ajv-cli
        run: npm install -g ajv-cli ajv-formats

      - name: Validate projects-registry.json against schema
        run: ajv validate -s projects-registry.schema.json -d projects-registry.json --spec=draft7
